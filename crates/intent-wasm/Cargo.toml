[package]
name = "intent-wasm"
description = "WebAssembly bridge that lets a web page drive the Intent engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Same lints as the workspace, except that unsafe code is denied rather than
# forbidden: the wasm-bindgen macros generate the unsafe glue for the browser
# boundary and need to be able to allow it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"

[dependencies]
intent-core = { path = "../intent-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"

# The optimiser is a separate download and the module is small without it.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
